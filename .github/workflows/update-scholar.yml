name: Update Scholar metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/update-scholar.mjs
      - name: Commit updated metrics
        run: |
          if git diff --quiet -- data/scholar.yml; then
            echo "Scholar metrics unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar.yml
          git commit -m "Update Scholar metrics"
          git push
