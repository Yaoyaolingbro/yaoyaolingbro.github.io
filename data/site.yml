experience:
  - organization: ZJU CAD&CG Lab
    role: Research Assistant
    period: 2024.01 - Present
    location: Hangzhou, China
    bullets:
      - Contributed to Omni-R1 multimodal reinforcement learning pipeline, including training components and reward shaping for omnimodal reasoning.
      - Built a face-swapping pipeline on a video generation backbone with emphasis on source-video realism.
      - Led protein representation learning research funded by Zhejiang University Research Fund.
  - organization: ZJUSCT & AIRA, Zhejiang University
    role: Founder and Team Lead
    period: 2023.10 - Present
    location: Hangzhou, China
    bullets:
      - Founded AIRA and established university-supported AI research and talent development activities.
      - Led server architecture and multi-GPU acceleration work as a core CUDA programmer at ZJUSCT.
      - Mentored student teams in Huawei ICT competitions, including a national first-prize team in the Ascend LLM track.

