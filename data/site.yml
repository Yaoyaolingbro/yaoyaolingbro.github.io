about:
  paragraphs:
    - I am an incoming PhD student at Zhejiang University CAD&CG Lab, advised by Prof. Chunhua Shen and Prof. Hao Chen. My work sits at the intersection of multimodal reasoning, spatial intelligence.
    - Beyond research, I founded AIRA at Zhejiang University and work on high-performance profiling and optimization at ZJUSCT. I am interested in turning frontier AI research into real systems, tools, and industry-facing products.
  tags:
    - Multimodal Reasoning
    - Physical AI
    - High-Performance Computing

